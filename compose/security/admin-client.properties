# Admin client for the secured cluster: health checks, ACL provisioning, and
# manual verification. The truststore is the self-signed CA generated by
# kafka-secured's entrypoint into the `security-certs` volume.
security.protocol=SASL_SSL
sasl.mechanism=PLAIN
sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="admin-secret";
ssl.truststore.location=/tmp/certs/ca.pem
ssl.truststore.type=PEM
