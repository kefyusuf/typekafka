# MirrorMaker 2: replicate orders.* from the primary cluster to kafka-b.
clusters = source, target
source.bootstrap.servers = kafka:9092
target.bootstrap.servers = kafka-b:9092

source->target.enabled = true
target->source.enabled = false
source->target.topics = orders.*

# Single-node clusters: all MM2 internal topics must use RF 1.
replication.factor = 1
checkpoints.topic.replication.factor = 1
heartbeats.topic.replication.factor = 1
offset-syncs.topic.replication.factor = 1

tasks.max = 1
sync.topic.acls.enabled = false
refresh.topics.interval.seconds = 10
