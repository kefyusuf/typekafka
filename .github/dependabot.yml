version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint peers cap TypeScript below 7; revisit when it supports TS 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories:
      - /apps/consumer
      - /apps/producer
      - /apps/web
      - /apps/customer-view
    schedule:
      interval: weekly
    ignore:
      # confluent-kafka-javascript ships prebuilt binaries only up to the
      # Node 24 ABI; Node 26+ images fail npm ci. Revisit when it catches up.
      - dependency-name: node
        update-types: ["version-update:semver-major"]