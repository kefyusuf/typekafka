name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest
    # GitHub-hosted runners ship with Docker, so the Testcontainers-based
    # real-Kafka integration suite runs here too; it skips gracefully if not.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (unit, no Docker)
        run: npm test

      # GitHub-hosted runners ship with Docker, so the Testcontainers-based
      # real-Kafka integration suite runs here too; it skips gracefully if not.
      - name: Test (integration, Docker-gated)
        run: npm run test:integration

  compose-config:
    name: Validate compose files
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile: [base, schema-registry, observability, mirror, security]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate compose file
        run: |
          if [ "${{ matrix.profile }}" = "base" ]; then
            docker compose config
          else
            docker compose --profile "${{ matrix.profile }}" config
          fi
