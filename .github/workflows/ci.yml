name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-lint-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  compose-config:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile: [base, schema-registry, observability, mirror, security]
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: |
          if [ "${{ matrix.profile }}" = "base" ]; then
            docker compose config
          else
            docker compose --profile "${{ matrix.profile }}" config
          fi
