name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest
    # GitHub-hosted runners ship with Docker, so the Testcontainers-based
    # real-Kafka integration suite runs here too; it skips gracefully if not.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (unit + integration)
        run: npm test

  compose-config:
    name: Validate compose files
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile: [base, schema-registry, observability, mirror, security]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose file
        run: |
          if [ "${{ matrix.profile }}" = "base" ]; then
            docker compose config
          else
            docker compose --profile "${{ matrix.profile }}" config
          fi
