name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Lint · Typecheck · Test
    runs-on: ubuntu-latest
    # GitHub-hosted runners ship with Docker, so the Testcontainers-based
    # real-Kafka integration suite runs here too; it skips gracefully if not.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test (unit, no Docker)
        run: npm test

      # GitHub-hosted runners ship with Docker, so the Testcontainers-based
      # real-Kafka integration suite runs here too; it skips gracefully if not.
      - name: Test (integration, Docker-gated)
        run: npm run test:integration

  examples:
    name: Examples (packed tarballs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Pack publishable tarballs
        run: npm run pack:packages

      # Examples consume the packed tarballs via file: deps, exactly like an
      # external consumer would install from a registry. This is the only job
      # that exercises the packages' files/exports/dist packaging.
      - name: Install example dependencies
        run: npm install
        working-directory: examples/hello-roundtrip

      - name: Build example
        run: npm run build
        working-directory: examples/hello-roundtrip

      - name: Test example
        run: npm test
        working-directory: examples/hello-roundtrip

      - name: Run example (CLI smoke)
        run: npm start
        working-directory: examples/hello-roundtrip

  compose-config:
    name: Validate compose files
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile: [base, schema-registry, observability, mirror, security]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate compose file
        run: |
          if [ "${{ matrix.profile }}" = "base" ]; then
            docker compose config
          else
            docker compose --profile "${{ matrix.profile }}" config
          fi
