services:
  kafka:
    # Official Apache image in KRaft mode (no ZooKeeper).
    # bitnami/kafka was pulled from Docker Hub, so we use apache/kafka instead.
    image: apache/kafka:3.7.0
    container_name: nodejs-kafka-kafka
    environment:
      # KRaft combined mode: single node runs controller + broker.
      # Env vars use the KAFKA_ prefix and map to server.properties keys
      # (dots -> underscores). The image auto-formats storage on first start.
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Unique base64 UUID identifying this KRaft cluster.
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      # Single-node cluster: internal topics need replication factor 1.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      # Topics are created by the app's admin client, not auto-created.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: nodejs-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY_URL: ${KAFKA_UI_SCHEMAREGISTRY_URL:-http://localhost:8081}
    depends_on:
      kafka:
        condition: service_healthy

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.0
    profiles: ["schema-registry"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/subjects || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ---- App services (Phase 2: confluent driver, real Kafka) ----
  # Producer and consumer talk through the Kafka cluster: the producer
  # publishes N order+payment pairs and exits; the consumer reads them with
  # the notification-service consumer group (parse -> retry -> DLQ -> commit).
  # The broker keeps its KRaft logs inside the container, so `docker compose
  # down` resets Kafka state and the next `up` replays from the beginning.
  # customer-view exposes the compacted `customers` topic as an HTTP read model.

  producer:
    build:
      context: .
      dockerfile: apps/producer/Dockerfile
    container_name: nodejs-kafka-producer
    environment:
      SERVICE_NAME: producer
      BROKER_DRIVER: confluent
      BROKER_BROKERS: kafka:9092
      LOG_LEVEL: info
      SCHEMA_REGISTRY_URL: ${SCHEMA_REGISTRY_URL:-}
      # Observability (inert without the observability profile)
      METRICS_PORT: "9464"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_SERVICE_NAME: producer
    depends_on:
      kafka:
        condition: service_healthy

  consumer:
    build:
      context: .
      dockerfile: apps/consumer/Dockerfile
    container_name: nodejs-kafka-consumer
    environment:
      SERVICE_NAME: consumer
      BROKER_DRIVER: confluent
      BROKER_BROKERS: kafka:9092
      CONSUMER_GROUP_ID: notification-service
      CONSUMER_FROM_BEGINNING: "true"
      LOG_LEVEL: info
      SCHEMA_REGISTRY_URL: ${SCHEMA_REGISTRY_URL:-}
      # Observability (inert without the observability profile)
      METRICS_PORT: "9465"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_SERVICE_NAME: consumer
    depends_on:
      kafka:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: nodejs-kafka-web
    ports:
      - "3000:3000"
    environment:
      BROKER_DRIVER: confluent
      BROKER_BROKERS: kafka:9092
      BROKER_CLIENT_ID: nodejs-kafka-web
      LOG_LEVEL: info
      WEB_PORT: "3000"
      TELEMETRY_GROUP_ID: web-telemetry
      SCHEMA_REGISTRY_URL: ${SCHEMA_REGISTRY_URL:-}
      OUTBOX_DB_PATH: /data/outbox.db
      # Observability (inert without the observability profile)
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_SERVICE_NAME: web
    volumes:
      - web-outbox:/data
    depends_on:
      kafka:
        condition: service_healthy

  customer-view:
    build:
      context: .
      dockerfile: apps/customer-view/Dockerfile
    container_name: nodejs-kafka-customer-view
    ports:
      - "3001:3001"
    environment:
      BROKER_DRIVER: confluent
      BROKER_BROKERS: kafka:9092
      BROKER_CLIENT_ID: nodejs-kafka-customer-view
      LOG_LEVEL: info
      CUSTOMER_VIEW_PORT: "3001"
      SCHEMA_REGISTRY_URL: ${SCHEMA_REGISTRY_URL:-}
      # Observability (inert without the observability profile)
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_SERVICE_NAME: customer-view
    depends_on:
      kafka:
        condition: service_healthy

  # ---- Observability profile (Phase 3a) ----
  # otel-collector receives OTLP traces over HTTP from the app services and
  # dumps them to stdout via the debug exporter; prometheus scrapes the four
  # app metric endpoints plus the collector's own /metrics; grafana visualizes
  # them with a provisioned Prometheus datasource and the nodejs-kafka
  # dashboard. All three run only with: docker compose --profile observability up.

  otel-collector:
    # 0.111.0 pinned: known-good contrib release for the otlp receiver +
    # debug exporter used here; avoids drift from a `latest` tag.
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: nodejs-kafka-otel-collector
    command: --config /etc/otel-collector.yaml
    volumes:
      - ./compose/observability/otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "4318:4318"
    profiles: ["observability"]

  prometheus:
    # v2.53.0 pinned: stable release; newer majors change CLI flags.
    image: prom/prometheus:v2.53.0
    container_name: nodejs-kafka-prometheus
    command: --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./compose/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    profiles: ["observability"]

  grafana:
    # 11.1.0 pinned: supports dashboard schemaVersion 39 used here.
    image: grafana/grafana:11.1.0
    container_name: nodejs-kafka-grafana
    ports:
      - "3002:3000" # host 3000 is taken by the web app
    volumes:
      - ./compose/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./compose/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      GF_USERS_ALLOW_SIGN_UP: "false"
    profiles: ["observability"]

volumes:
  web-outbox:

