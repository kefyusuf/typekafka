services:
  kafka:
    # Official Apache image in KRaft mode (no ZooKeeper).
    # bitnami/kafka was pulled from Docker Hub, so we use apache/kafka instead.
    image: apache/kafka:3.7.0
    container_name: nodejs-kafka-kafka
    environment:
      # KRaft combined mode: single node runs controller + broker.
      # Env vars use the KAFKA_ prefix and map to server.properties keys
      # (dots -> underscores). The image auto-formats storage on first start.
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Unique base64 UUID identifying this KRaft cluster.
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"
      # Single-node cluster: internal topics need replication factor 1.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      # Topics are created by the app's admin client, not auto-created.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "9092:9092"
    # NOTE: `read_only` is intentionally omitted here. The apache/kafka
    # entrypoint regenerates /opt/kafka/config at startup, which requires a
    # writable root filesystem; the other hardening (cap_drop, no-new-privileges,
    # resource limits) still applies. Logs live in /tmp (tmpfs, ephemeral).
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1G"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: nodejs-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY_URL: ${KAFKA_UI_SCHEMAREGISTRY_URL:-http://localhost:8081}
      # Mirror cluster shows up in the UI even without the mirror profile
      # (listed as down until `--profile mirror` is up), matching cluster 0
      # referencing a schema registry that may not be running.
      KAFKA_CLUSTERS_1_NAME: mirror
      KAFKA_CLUSTERS_1_BOOTSTRAPSERVERS: kafka-b:9092
      KAFKA_CLUSTERS_1_SCHEMAREGISTRY_URL: ${KAFKA_UI_SCHEMAREGISTRY_URL:-http://localhost:8081}
      # Secured cluster (SASL_SSL) — listed as down until `--profile security`
      # brings up kafka-secured and populates the truststore on the
      # `security-certs` volume. Matches the mirror cluster pattern above.
      KAFKA_CLUSTERS_2_NAME: secured
      KAFKA_CLUSTERS_2_BOOTSTRAPSERVERS: kafka-secured:9095
      KAFKA_CLUSTERS_2_SECURITY_PROTOCOL: SASL_SSL
      KAFKA_CLUSTERS_2_SASL_MECHANISM: PLAIN
      KAFKA_CLUSTERS_2_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="admin" password="${KAFKA_ADMIN_PASSWORD:-admin-secret}";'
      KAFKA_CLUSTERS_2_SSL_TRUSTSTORE_CERTS: /certs/ca.pem
      # kafka-ui is open by default (no login). The built-in login-form auth is
      # opt-in: uncomment the three lines below AND set KAFKA_UI_AUTH_TYPE=LOGIN_FORM
      # in .env (default creds admin/admin) to enable it. Note: the provectuslabs
      # kafka-ui login form does not persist a session in this image, so leaving it
      # open is the reliable choice for local/manual testing.
      # AUTH_TYPE: ${KAFKA_UI_AUTH_TYPE:-LOGIN_FORM}
      # AUTH_LOGIN_FORM_USERNAME: ${KAFKA_UI_USERNAME:-admin}
      # AUTH_LOGIN_FORM_PASSWORD: ${KAFKA_UI_PASSWORD:-admin}
    volumes:
      - security-certs:/certs:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512M"
    depends_on:
      kafka:
        condition: service_healthy

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.0
    profiles: ["schema-registry"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    ports:
      - "8081:8081"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1G"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8081/subjects || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # ---- Mirror profile (Phase 3b.1) ----
  # kafka-b is a second single-node KRaft cluster that MirrorMaker 2 copies
  # the orders.* topics into; mirror-maker runs the Confluent MM2 container,
  # whose default command loads /tmp/config/mm2.properties from the mounted
  # volume. Both run only with: docker compose --profile mirror up

  kafka-b:
    image: apache/kafka:3.7.0
    container_name: nodejs-kafka-kafka-b
    profiles: ["mirror"]
    environment:
      # KRaft combined mode: single node runs controller + broker.
      # Env vars use the KAFKA_ prefix and map to server.properties keys
      # (dots -> underscores). The image auto-formats storage on first start.
      KAFKA_NODE_ID: "2"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-b:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-b:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Each KRaft cluster must have a unique base64 UUID, so kafka-b gets
      # its own (different from the primary's CLUSTER_ID).
      CLUSTER_ID: "3l8nNvzYS4uCg7TpHr0bWQ=="
      # Single-node cluster: internal topics need replication factor 1.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      # Topics are created by the app's admin client, not auto-created.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      # Host 9092 is taken by the primary; 9094 exposes kafka-b for checks.
      - "9094:9092"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1G"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  mirror-maker:
    # 7.7.0 matches cp-schema-registry 7.7.0; the image's default command is
    # /bin/connect-mirror-maker /tmp/config/mm2.properties, so we only mount
    # the config.
    image: confluentinc/cp-kafka-mirror-maker:7.7.0
    container_name: nodejs-kafka-mirror-maker
    profiles: ["mirror"]
    volumes:
      - ./compose/mirror/mm2.properties:/tmp/config/mm2.properties:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512M"
    depends_on:
      kafka:
        condition: service_healthy
      kafka-b:
        condition: service_healthy

  # ---- Security profile (Phase 3c.2) ----
  # kafka-secured is a second KRaft cluster locked down with SASL_SSL (PLAIN
  # auth + AclAuthorizer, topic-scoped ACLs). Self-signed certs are generated
  # inside the container by the entrypoint, so no host scripts are needed.
  # security-init is a one-shot job that grants the app user ACLs and gates the
  # secured apps. All run only with: docker compose --profile security up

  kafka-secured:
    # SASL_SSL-secured KRaft cluster (PLAIN auth + AclAuthorizer, topic ACLs).
    # Self-signed certs are generated inside the container by the entrypoint
    # (keytool, Windows-safe — no host scripts).
    image: apache/kafka:3.7.0
    container_name: nodejs-kafka-kafka-secured
    profiles: ["security"]
    entrypoint: ["/bin/sh", "/tmp/security/kafka-entrypoint.sh"]
    volumes:
      - ./compose/security/kafka-entrypoint.sh:/tmp/security/kafka-entrypoint.sh:ro
      - ./compose/security/admin-client.properties:/tmp/security/admin-client.properties:ro
      - security-certs:/tmp/certs
    environment:
      KAFKA_NODE_ID: "3"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 3@kafka-secured:9093
      KAFKA_LISTENERS: SASL_SSL://:9095,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: SASL_SSL://kafka-secured:9095
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,SASL_SSL:SASL_SSL
      KAFKA_INTER_BROKER_LISTENER_NAME: SASL_SSL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Each KRaft cluster must have a unique base64 UUID, so kafka-secured
      # gets its own (different from the primary's and kafka-b's CLUSTER_ID).
      CLUSTER_ID: "6lM2RfnzQJ6uP3wD7yJXWA=="
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # PLAIN auth on the SASL_SSL listener: admin (super user) + app.
      # Users/passwords come from the JAAS file loaded via KAFKA_OPTS below
      # (the apache/kafka image's configure script requires KAFKA_OPTS to
      # contain java.security.auth.login.config).
      KAFKA_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_LISTENER_NAME_SASL_SSL_SASL_ENABLED_MECHANISMS: PLAIN
      KAFKA_SASL_MECHANISM_INTER_BROKER_PROTOCOL: PLAIN
      # TLS: the image's configure script reads the keystore from
      # /etc/kafka/secrets/<filename> (symlinked to /tmp/certs in the entrypoint)
      # and passwords from the credential files there. KEYSTORE_TYPE is not
      # touched by configure, so it stays as a direct env.
      KAFKA_SSL_KEYSTORE_TYPE: PKCS12
      KAFKA_SSL_KEYSTORE_FILENAME: keystore.p12
      KAFKA_SSL_KEY_CREDENTIALS: key_creds
      KAFKA_SSL_KEYSTORE_CREDENTIALS: keystore_creds
      KAFKA_SSL_TRUSTSTORE_LOCATION: /etc/kafka/secrets/truststore.p12
      KAFKA_SSL_TRUSTSTORE_TYPE: PKCS12
      KAFKA_SSL_TRUSTSTORE_PASSWORD: changeit  # demo keystore password (non-production; replace with a real keystore)
      KAFKA_OPTS: "-Djava.security.auth.login.config=/etc/kafka/secrets/kafka_jaas.conf"
      # KRaft stores ACLs in the __cluster_metadata log via the StandardAuthorizer
      # (KIP-801) — the legacy AclAuthorizer is ZooKeeper-based and NPEs in KRaft.
      # ANONYMOUS is super because the internal CONTROLLER listener is PLAINTEXT
      # (KRaft controller principal).
      KAFKA_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
      KAFKA_SUPER_USERS: User:admin;User:ANONYMOUS
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
    ports:
      - "9095:9095"
    # Started as root only so the entrypoint can generate the PKCS12 keystore
    # + JAAS into the `security-certs` volume (Docker mounts it root-owned) and
    # chown those paths to the image's non-root `appuser`. The entrypoint then
    # drops privileges (`su appuser`) so the long-running broker process itself
    # runs as the non-root user, not root. For production, use a
    # pre-provisioned keystore + a non-root user and drop this override.
    user: "0:0"
    read_only: true
    tmpfs:
      - /tmp
      - /etc/kafka/secrets
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1G"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9095 --command-config /tmp/security/admin-client.properties --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  security-init:
    # One-shot job: grants the app user topic-scoped ACLs, then exits. The
    # secured apps start only after it completes.
    image: apache/kafka:3.7.0
    container_name: nodejs-kafka-security-init
    profiles: ["security"]
    entrypoint: ["/bin/sh", "/tmp/security/provision-acls.sh"]
    volumes:
      - ./compose/security/provision-acls.sh:/tmp/security/provision-acls.sh:ro
      - ./compose/security/admin-client.properties:/tmp/security/admin-client.properties:ro
      - security-certs:/tmp/certs:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "256M"
    depends_on:
      kafka-secured:
        condition: service_healthy
    restart: "no"

  # ---- App services (Phase 2: confluent driver, real Kafka) ----
  # Producer and consumer talk through the Kafka cluster: the producer
  # publishes N order+payment pairs and exits; the consumer reads them with
  # the notification-service consumer group (parse -> retry -> DLQ -> commit).
  # The broker keeps its KRaft logs inside the container, so `docker compose
  # down` resets Kafka state and the next `up` replays from the beginning.
  # customer-view exposes the compacted `customers` topic as an HTTP read model.

  producer:
    build:
      context: .
      dockerfile: apps/producer/Dockerfile
    container_name: nodejs-kafka-producer
    environment:
      SERVICE_NAME: producer
      BROKER_DRIVER: confluent
      BROKER_BROKERS: kafka:9092
      LOG_LEVEL: info
      SCHEMA_REGISTRY_URL: ${SCHEMA_REGISTRY_URL:-}
      # Observability (inert without the observability profile)
      METRICS_PORT: "9464"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_SERVICE_NAME: producer
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512M"
    depends_on:
      kafka:
        condition: service_healthy

  consumer:
    build:
      context: .
      dockerfile: apps/consumer/Dockerfile
    container_name: nodejs-kafka-consumer
    environment:
      SERVICE_NAME: consumer
      BROKER_DRIVER: confluent
      BROKER_BROKERS: kafka:9092
      CONSUMER_GROUP_ID: notification-service
      CONSUMER_FROM_BEGINNING: "true"
      LOG_LEVEL: info
      SCHEMA_REGISTRY_URL: ${SCHEMA_REGISTRY_URL:-}
      # Observability (inert without the observability profile)
      METRICS_PORT: "9465"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_SERVICE_NAME: consumer
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512M"
    depends_on:
      kafka:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: nodejs-kafka-web
    ports:
      - "3000:3000"
    environment:
      BROKER_DRIVER: confluent
      BROKER_BROKERS: kafka:9092
      BROKER_CLIENT_ID: nodejs-kafka-web
      LOG_LEVEL: info
      WEB_PORT: "3000"
      TELEMETRY_GROUP_ID: web-telemetry
      SCHEMA_REGISTRY_URL: ${SCHEMA_REGISTRY_URL:-}
      OUTBOX_DB_PATH: /data/outbox.db
      # Observability (inert without the observability profile)
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_SERVICE_NAME: web
      # Demo-only basic-auth for the web UI + /metrics (off unless set).
      HTTP_BASIC_AUTH: ${HTTP_BASIC_AUTH:-}
    # The app runs as a non-root user, so a root-owned named volume would not
    # be writable for the SQLite outbox. A tmpfs at /data is world-writable
    # (1777) and works under the non-root user; the outbox DB is therefore
    # ephemeral (reset on container restart) — fine for the demo.
    read_only: true
    tmpfs:
      - /data
      - /tmp
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512M"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${WEB_PORT}/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      kafka:
        condition: service_healthy

  customer-view:
    build:
      context: .
      dockerfile: apps/customer-view/Dockerfile
    container_name: nodejs-kafka-customer-view
    ports:
      - "3001:3001"
    environment:
      BROKER_DRIVER: confluent
      BROKER_BROKERS: kafka:9092
      BROKER_CLIENT_ID: nodejs-kafka-customer-view
      LOG_LEVEL: info
      CUSTOMER_VIEW_PORT: "3001"
      SCHEMA_REGISTRY_URL: ${SCHEMA_REGISTRY_URL:-}
      # Observability (inert without the observability profile)
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_SERVICE_NAME: customer-view
      # Demo-only basic-auth for the customer view UI + /metrics (off unless set).
      HTTP_BASIC_AUTH: ${HTTP_BASIC_AUTH:-}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512M"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${CUSTOMER_VIEW_PORT}/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      kafka:
        condition: service_healthy

  producer-secured:
    build:
      context: .
      dockerfile: apps/producer/Dockerfile
    container_name: nodejs-kafka-producer-secured
    profiles: ["security"]
    volumes:
      - security-certs:/certs:ro
    environment:
      SERVICE_NAME: producer-secured
      BROKER_DRIVER: confluent
      BROKER_BROKERS: kafka-secured:9095
      BROKER_SASL_USERNAME: app
      BROKER_SASL_PASSWORD: ${BROKER_SASL_APP_PASSWORD:-app-secret}
      BROKER_SSL_CA_PATH: /certs/ca.pem
      LOG_LEVEL: info
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512M"
    depends_on:
      kafka-secured:
        condition: service_healthy
      security-init:
        condition: service_completed_successfully

  consumer-secured:
    build:
      context: .
      dockerfile: apps/consumer/Dockerfile
    container_name: nodejs-kafka-consumer-secured
    profiles: ["security"]
    volumes:
      - security-certs:/certs:ro
    environment:
      SERVICE_NAME: consumer-secured
      BROKER_DRIVER: confluent
      BROKER_BROKERS: kafka-secured:9095
      BROKER_SASL_USERNAME: app
      BROKER_SASL_PASSWORD: ${BROKER_SASL_APP_PASSWORD:-app-secret}
      BROKER_SSL_CA_PATH: /certs/ca.pem
      CONSUMER_GROUP_ID: notification-service
      CONSUMER_FROM_BEGINNING: "true"
      LOG_LEVEL: info
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512M"
    depends_on:
      kafka-secured:
        condition: service_healthy
      security-init:
        condition: service_completed_successfully

  # ---- Observability profile (Phase 3a) ----
  # otel-collector receives OTLP traces over HTTP from the app services and
  # dumps them to stdout via the debug exporter; prometheus scrapes the four
  # app metric endpoints plus the collector's own /metrics; grafana visualizes
  # them with a provisioned Prometheus datasource and the nodejs-kafka
  # dashboard. All three run only with: docker compose --profile observability up

  otel-collector:
    # 0.111.0 pinned: known-good contrib release for the otlp receiver +
    # debug exporter used here; avoids drift from a `latest` tag.
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: nodejs-kafka-otel-collector
    command: --config /etc/otel-collector.yaml
    volumes:
      - ./compose/observability/otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "4318:4318"
    profiles: ["observability"]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512M"

  prometheus:
    # v2.53.0 pinned: stable release; newer majors change CLI flags.
    image: prom/prometheus:v2.53.0
    container_name: nodejs-kafka-prometheus
    command: --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./compose/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    profiles: ["observability"]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1G"

  grafana:
    # 11.1.0 pinned: supports dashboard schemaVersion 39 used here.
    image: grafana/grafana:11.1.0
    container_name: nodejs-kafka-grafana
    ports:
      - "3002:3000" # host 3000 is taken by the web app
    volumes:
      - ./compose/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./compose/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    profiles: ["observability"]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "512M"

volumes:
  security-certs:
  prometheus-data:
  grafana-data:
